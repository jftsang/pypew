[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pypew"
description = "Pew sheet generator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "J. M. F. Tsang", email = "j.m.f.tsang@cantab.net" }]
keywords = ["church", "anglican", "liturgy", "pew sheet", "flask"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dynamic = ["version"]
dependencies = [
  "appdirs>=1.4",
  "docxtpl>=0.15.2",
  "flask>=2.2,<3",
  "flask-pydantic>=0.14",
  "flask-wtf>=1.2.1",
  "gunicorn>=20.1",
  "jinja2>=3.1.2",
  "pydantic>=2.13",
  "python-dateutil>=2.8.2",
  "python-docx>=0.8.11",
  "python-dotenv>=0.21",
  "pyyaml>=6",
  "werkzeug>=2.2,<3",
  "wtforms>=3.0.1",
]

[project.optional-dependencies]
# NEH hymn lookup reads a CSV via pandas; the app degrades gracefully without it.
hymns = ["pandas>=2"]
# Extra packages for the scripts in scripts/.
scripts = ["pandas>=2", "python-slugify>=7"]

[project.scripts]
pypew = "pypew.app:main"

[project.urls]
Homepage = "https://github.com/jftsang/pypew"
Source = "https://github.com/jftsang/pypew"

[dependency-groups]
dev = ["pandas>=2", "parameterized>=0.8", "ruff"]
build = ["pyinstaller>=6"]

[tool.hatch.version]
path = "src/pypew/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pypew"]
# .gitignore excludes *.csv globally, but neh.csv is tracked and required at
# runtime for the NEH hymn lookup, so force it into the wheel.
artifacts = ["src/pypew/data/neh.csv"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/README.md", "/LICENSE"]
artifacts = ["/src/pypew/data/neh.csv", "/scripts/feasts.csv"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "DTZ", "BLE"]
# Each of these is a known, deliberate style choice in this codebase. The
# matching code carries a `# FIXME(<CODE>)` marker; deleting an entry here
# resurfaces exactly that debt.
ignore = [
  "B904",    # utils.py: raise inside except
  "BLE001",  # views/: deliberate catch-all in error handling
  "DTZ005",  # models.py: local wall-clock year, no timezone needed
  "DTZ011",  # naive local dates throughout
  "E501",    # docstring URLs and long f-strings
  "E731",    # models_base.py: single-expression predicate
  "F403",    # views/__init__.py: star re-exports of the url rule handlers
  "PIE810",  # tests: explicit .endswith chain
  "RUF005",  # forms.py: explicit concatenation
  "RUF012",  # WTForms fields and style dicts are class attributes
  "SIM108",  # dateexpr.py: if/else reads better than a ternary here
]

[tool.ruff.lint.isort]
known-first-party = ["pypew"]
